<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云马日历 · 龙哥日程</title>
<style>
:root{--bg:#1a1a2e;--card:#16213e;--text:#e0e0e0;--text2:#a0a0b0;--border:#2a2a4a;--accent:#4da6ff;--meeting:#e74c3c;--teaching:#3498db;--personal:#27ae60;--deadline:#f39c12;--today-ring:#ff6b6b;--holiday:#ff9f43;--lunar:#8a8aaa;--danger:#e74c3c;--save:#27ae60;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;font-weight:600;color:var(--accent)}
.nav{display:flex;align-items:center;gap:12px}
.nav button{background:var(--border);border:none;color:var(--text);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;transition:.2s}
.nav button:hover{background:#3a3a5a}
.nav .month-label{font-size:16px;font-weight:600;min-width:110px;text-align:center}
.nav .today-btn{background:var(--accent);color:#fff}
.container{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:768px){.container{grid-template-columns:1fr}}
.calendar-grid{background:var(--card);border-radius:10px;border:1px solid var(--border);overflow:hidden}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);background:#0f3460;padding:8px 0;font-size:13px;color:var(--text2);text-align:center;font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day-cell{min-height:88px;padding:4px 5px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:.15s;position:relative}
.day-cell:nth-child(7n){border-right:none}
.day-cell:hover{background:#1a2744}
.day-cell.other-month{opacity:0.35}
.day-cell.today{background:#1a2744;box-shadow:inset 0 0 0 2px var(--today-ring)}
.day-cell.selected{background:#1e3050;box-shadow:inset 0 0 0 2px var(--accent)}
.day-cell.holiday{background:rgba(255,159,67,0.08)}
.day-cell .add-hint{display:none;position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;line-height:18px;text-align:center;opacity:0;transition:.2s}
.day-cell:hover .add-hint{display:block;opacity:0.9}
.day-num{font-size:13px;font-weight:600;margin-bottom:1px}
.day-cell.today .day-num{color:var(--today-ring)}
.day-cell.holiday .day-num{color:var(--holiday)}
.day-lunar{font-size:10px;color:var(--lunar);margin-bottom:2px}
.day-lunar.holiday-text{color:var(--holiday);font-weight:600}
.day-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:1px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.meeting{background:var(--meeting)}.dot.teaching{background:var(--teaching)}
.dot.personal{background:var(--personal)}.dot.deadline{background:var(--deadline)}
.day-label{font-size:9px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.sidebar{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:16px}
.sidebar h3{font-size:15px;color:var(--accent);margin-bottom:4px}
.event-list-panel{max-height:300px;overflow-y:auto}
.event-item2{padding:8px 10px;border-radius:6px;margin-bottom:4px;border-left:3px solid var(--border);font-size:13px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}position:relative}
.event-item2:hover{background:#1e3050}
.event-item2 .e-time{font-size:11px;color:var(--text2)}
.event-item2 .e-title{font-weight:600}
.event-item2 .e-repeat{font-size:10px;color:var(--accent);margin-left:4px}
.event-item2 .e-del{width:22px;height:22px;border-radius:50%;border:none;cursor:pointer;font-size:11px;line-height:22px;text-align:center;flex-shrink:0;background:var(--danger);color:#fff;border:none;font-size:12px;line-height:20px;text-align:center;cursor:pointer}
.event-item2:hover .e-del{display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:12px}
.legend-dot{width:10px;height:10px;border-radius:3px}
.legend-dot.meeting{background:var(--meeting)}.legend-dot.teaching{background:var(--teaching)}
.legend-dot.personal{background:var(--personal)}.legend-dot.deadline{background:var(--deadline)}
.legend-dot.holiday{background:var(--holiday)}
.filter-btns{display:flex;flex-wrap:wrap;gap:4px}
.filter-btn{font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:.15s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.popup{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:100;justify-content:center;align-items:center}
.popup.show{display:flex}
.popup-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:440px;width:90%;max-height:90vh;overflow-y:auto}
.popup-card .pc-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:16px}
.popup-card .pc-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer}
.popup-card .pc-title{font-size:18px;font-weight:700}
.popup-card .pc-meta{font-size:13px;color:var(--text2);margin:4px 0}
.popup-card .pc-desc{font-size:14px;margin-top:12px;line-height:1.6;color:#ccc}
.popup-card .pc-actions{margin-top:16px;display:flex;gap:8px}
.popup-card .pc-actions button{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px}
.popup-card .pc-actions .btn-edit{background:var(--accent);color:#fff}
.popup-card .pc-actions .btn-del{background:var(--danger);color:#fff}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
.form-group textarea{resize:vertical;min-height:60px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.form-actions button{padding:8px 20px;border-radius:6px;border:none;cursor:pointer;font-size:14px;font-weight:600}
.btn-save{background:var(--save);color:#fff}
.btn-cancel{background:var(--border);color:var(--text)}
.btn-del-confirm{background:var(--danger);color:#fff}
.stats{font-size:12px;color:var(--text2);text-align:center;padding:8px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.footer-links{text-align:center;font-size:12px;color:var(--text2);margin-top:8px}
.footer-links a{color:var(--accent);text-decoration:none;margin:0 4px}
</style>
</head>
<body>
<div class="header">
<h1>🗓 云马日历</h1>
<div class="nav">
<button onclick="prevMonth()">◀</button>
<span class="month-label" id="monthLabel"></span>
<button onclick="nextMonth()">▶</button>
<button class="today-btn" onclick="goToday()">今天</button>
</div>
</div>
<div class="container">
<div>
<div class="calendar-grid">
<div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
<div class="days" id="daysGrid"></div>
</div>
<div class="stats" id="statsBar"></div>
</div>
<div class="sidebar">
<div style="background:#1e3050;border-radius:8px;padding:12px;margin-bottom:4px">
<h3 style="margin-bottom:8px">🤖 智能添加</h3>
<textarea id="smartInput" placeholder="输入文字，或上传文件自动解析...&#10;&#10;例如：5月20日下午3点行政楼301开教学研讨会，每周一次" style="width:100%;height:60px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-family:inherit;resize:vertical"></textarea>
<div style="display:flex;gap:4px;margin-top:6px">
<input type="file" id="smartFile" accept=".txt,.md,.docx,.pdf,.jpg,.jpeg,.png,.bmp,.webp" style="display:none" onchange="handleFileUpload(event)">
<button onclick="document.getElementById('smartFile').click()" style="flex:1;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-size:12px">📎 上传文件</button>
<button onclick="smartParse()" style="flex:1;padding:6px;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:12px;font-weight:600">🔍 解析</button>
</div>
<div id="smartPreview" style="margin-top:6px;font-size:11px;color:var(--text2);display:none"></div>
</div><div><h3>📋 筛选</h3>
<div class="filter-btns" id="filterBtns">
<button class="filter-btn active" data-cat="all">全部</button>
<button class="filter-btn" data-cat="会议">🔴 会议</button>
<button class="filter-btn" data-cat="教学">🔵 教学</button>
<button class="filter-btn" data-cat="个人">🟢 个人</button>
<button class="filter-btn" data-cat="截止日">🟡 截止日</button>
</div></div>
<div><h3>📅 <span id="sidebarDateLabel">事件详情</span></h3>
<div class="event-list-panel" id="eventList"><div style="color:#666;font-size:13px;padding:20px;text-align:center">点击日历日期<br>查看/添加事件</div></div></div>
<div><h3>📊 图例</h3>
<div class="legend">
<div class="legend-item"><span class="legend-dot meeting"></span> 会议</div>
<div class="legend-item"><span class="legend-dot teaching"></span> 教学</div>
<div class="legend-item"><span class="legend-dot personal"></span> 个人</div>
<div class="legend-item"><span class="legend-dot deadline"></span> 截止日</div>
<div class="legend-item"><span class="legend-dot holiday"></span> 法定假日</div>
</div></div>
<div class="footer-links"><span>📱 华为日历：</span><a href="日程导出.ics">下载ICS</a><br><span style="font-size:11px">点击日期添加事件 · 数据存于浏览器</span></div>
</div>
</div>

<!-- 事件详情弹窗 -->
<div class="popup" id="detailPopup" onclick="closePopup('detailPopup',event)">
<div class="popup-card" onclick="event.stopPropagation()">
<div class="pc-header"><span class="pc-title" id="dcTitle"></span><button class="pc-close" onclick="closePopup('detailPopup')">✕</button></div>
<div class="pc-meta" id="dcTime"></div><div class="pc-meta" id="dcLoc"></div>
<div class="pc-meta" id="dcRepeat"></div>
<div class="pc-desc" id="dcDesc"></div>
<div class="pc-actions">
<button class="btn-edit" id="btnEdit">✏️ 编辑</button>
<button class="btn-del" id="btnDel">🗑 删除</button>
</div></div></div>

<!-- 添加/编辑事件表单弹窗 -->
<div class="popup" id="formPopup" onclick="closePopup('formPopup',event)">
<div class="popup-card" onclick="event.stopPropagation()">
<div class="pc-header"><span class="pc-title" id="formTitle">添加事件</span><button class="pc-close" onclick="closePopup('formPopup')">✕</button></div>
<div class="form-group"><label>事件标题 *</label><input type="text" id="fSummary" placeholder="例如：党委会"></div>
<div class="form-row">
<div class="form-group"><label>开始时间</label><input type="datetime-local" id="fStart"></div>
<div class="form-group"><label>结束时间</label><input type="datetime-local" id="fEnd"></div>
</div>
<div class="form-group"><label>地点</label><input type="text" id="fLocation" placeholder="例如：行政楼301"></div>
<div class="form-row">
<div class="form-group"><label>分类</label><select id="fCategory"><option value="会议">🔴 会议</option><option value="教学">🔵 教学</option><option value="个人">🟢 个人</option><option value="截止日">🟡 截止日</option></select></div>
<div class="form-group"><label>重复</label><select id="fRepeat"><option value="">单次</option><option value="daily">每天</option><option value="weekly">每周</option><option value="biweekly">每2周</option><option value="triweekly">每3周</option><option value="quadweekly">每4周</option><option value="monthly">每月</option><option value="yearly">每年</option></select></div>
</div>
<div class="form-group"><label>重复截止（可选）</label><input type="date" id="fRepeatUntil" placeholder="不填则无限重复"></div>
<div class="form-group"><label>描述</label><textarea id="fDescription" placeholder="可选"></textarea></div>
<input type="hidden" id="fEditIndex" value="-1">
<input type="hidden" id="fDateBase" value="">
<div class="form-actions">
<button class="btn-cancel" onclick="closePopup('formPopup')">取消</button>
<button class="btn-save" onclick="saveEvent()">💾 保存</button>
</div></div></div>

<!-- 删除确认弹窗 -->
<div class="popup" id="deleteConfirm" onclick="closePopup('deleteConfirm',event)">
<div class="popup-card" onclick="event.stopPropagation()" style="text-align:center">
<div class="pc-title" style="margin-bottom:12px">确认删除？</div>
<div style="color:var(--text2);margin-bottom:16px" id="delConfirmMsg"></div>
<div class="form-actions" style="justify-content:center">
<button class="btn-cancel" onclick="closePopup('deleteConfirm')">取消</button>
<button class="btn-del-confirm" onclick="confirmDelete()">确认删除</button>
</div></div></div>

<script>
// ==================== 数据层 ====================
var EVENTS=[];
var DEFAULT_EVENTS=[{summary:"云马日程系统上线",start:"2026-05-17T09:00",end:"2026-05-17T09:30",location:"办公室",category:"会议",description:"首次使用云马日程系统",repeat:"",repeatUntil:""}];

function loadEvents(){
  try{var d=localStorage.getItem("yunma_events");if(d){EVENTS=JSON.parse(d);return;}}catch(e){}
  EVENTS=JSON.parse(JSON.stringify(DEFAULT_EVENTS));
}
function saveEvents(){try{localStorage.setItem("yunma_events",JSON.stringify(EVENTS))}catch(e){}}

// ==================== 农历模块 ====================
var LUNAR_INFO=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06aa0,0x1a6c4,0x0aae0,0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,0x0d520];
var GAN=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
var ZHI=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
var SHENGXIAO=["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
var LUNAR_MONTH=["正","二","三","四","五","六","七","八","九","十","冬","腊"];
var LUNAR_DAY=["","初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
var HOLIDAYS={"2025-01-01":"元旦","2025-01-28":"除夕","2025-01-29":"春节","2025-01-30":"春节","2025-01-31":"春节","2025-02-01":"春节","2025-02-02":"春节","2025-02-03":"春节","2025-02-04":"春节","2025-04-04":"清明节","2025-05-01":"劳动节","2025-05-31":"端午节","2025-10-01":"国庆节","2025-10-06":"中秋节","2026-01-01":"元旦","2026-02-16":"除夕","2026-02-17":"春节","2026-02-18":"春节","2026-02-19":"春节","2026-02-20":"春节","2026-04-05":"清明节","2026-05-01":"劳动节","2026-06-19":"端午节","2026-09-25":"中秋节","2026-10-01":"国庆节","2027-01-01":"元旦","2027-02-05":"除夕","2027-02-06":"春节","2027-02-07":"春节","2027-02-08":"春节","2027-04-05":"清明节","2027-05-01":"劳动节","2027-06-09":"端午节","2027-09-15":"中秋节","2027-10-01":"国庆节"};
function lYearDays(y){var i,sum=348;for(i=0x8000;i>0x8;i>>=1)sum+=(LUNAR_INFO[y-1900]&i)?1:0;return sum+leapDays(y)}
function leapMonth(y){return LUNAR_INFO[y-1900]&0xf}
function leapDays(y){return leapMonth(y)?((LUNAR_INFO[y-1900]&0x10000)?30:29):0}
function monthDays(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29}
function solarToLunar(y,m,d){var i,lp=0,tmp=0,off=Math.floor((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);for(i=1900;i<2101&&off>0;i++)off-=lYearDays(i);if(off<0){off+=lYearDays(i-1);i--}var yr=i,isLp=false;var lpm=leapMonth(i);for(i=1;i<13&&off>0;i++){if(lpm>0&&i==(lpm+1)&&!isLp){--i;isLp=true;tmp=leapDays(yr)}else{tmp=monthDays(yr,i)}if(isLp&&i==(lpm+1))isLp=false;off-=tmp}if(off==0&&lpm>0&&i==lpm+1){if(isLp)isLp=false;else{isLp=true;--i}}if(off<0){off+=tmp;--i}return{lunarYear:yr,lunarMonth:i,lunarDay:off+1,isLeap:isLp}}
function getGanZhiYear(y){return GAN[(y-4)%10]+ZHI[(y-4)%12]}
function getShengXiao(y){return SHENGXIAO[(y-4)%12]}
function lunarDayStr(day){return LUNAR_DAY[day]||""}
function isHoliday(y,m,d){var ds=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");return HOLIDAYS[ds]||null}

// ==================== 重复事件计算 ====================
function dateStr(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function parseDate(str){var p=str.split("-");return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]))}

function eventOccursOn(evt,y,m,d){
  var st=new Date(evt.start),ed=new Date(evt.end);
  var cur=new Date(y,m,d);
  var startDay=new Date(st.getFullYear(),st.getMonth(),st.getDate());
  if(cur<startDay)return false;
  // 截止日期检查
  if(evt.repeatUntil){
    var ru=new Date(evt.repeatUntil+"T23:59:59");
    if(cur>ru)return false;
  }
  if(!evt.repeat){
    return cur.getFullYear()===st.getFullYear()&&cur.getMonth()===st.getMonth()&&cur.getDate()===st.getDate();
  }
  var diffDays=Math.round((cur-startDay)/(86400000));
  if(diffDays<0)return false;
  
  if(evt.repeat==="daily"){
    var interval=evt.repeatInterval||1;
    return diffDays%interval===0;
  }
  if(evt.repeat==="weekly"){
    var interval=evt.repeatInterval||1;
    return diffDays%(7*interval)===0;
  }
  if(evt.repeat==="biweekly"){return diffDays%14===0}
  if(evt.repeat==="triweekly"){return diffDays%21===0}
  if(evt.repeat==="quadweekly"){return diffDays%28===0}
  if(evt.repeat==="monthly"){
    var interval=evt.repeatInterval||1;
    if(cur.getDate()!==st.getDate())return false;
    var mDiff=(cur.getFullYear()-st.getFullYear())*12+(cur.getMonth()-st.getMonth());
    return mDiff>=0&&mDiff%interval===0;
  }
  if(evt.repeat==="yearly"){
    var interval=evt.repeatInterval||1;
    if(cur.getMonth()!==st.getMonth()||cur.getDate()!==st.getDate())return false;
    var yDiff=cur.getFullYear()-st.getFullYear();
    return yDiff>=0&&yDiff%interval===0;
  }
  return false;
}

// 获取某天的所有事件（包括重复事件）
function getEventsForDate(y,m,d){
  var result=[];
  for(var i=0;i<EVENTS.length;i++){
    if(eventOccursOn(EVENTS[i],y,m,d)){
      if(currentFilter==="all"||EVENTS[i].category===currentFilter)result.push(EVENTS[i]);
    }
  }
  return result;
}

function getMonthEvents(y,m){
  var result=[];
  for(var i=0;i<EVENTS.length;i++){
    var st=new Date(EVENTS[i].start);
    if(EVENTS[i].repeat){
      // 重复事件：检查是否与当月有交集
      var dim=new Date(y,m+1,0).getDate();
      for(var d=1;d<=dim;d++){
        if(eventOccursOn(EVENTS[i],y,m,d)&&(currentFilter==="all"||EVENTS[i].category===currentFilter)){
          result.push(EVENTS[i]);break;
        }
      }
    }else{
      if(st.getFullYear()===y&&st.getMonth()===m&&(currentFilter==="all"||EVENTS[i].category===currentFilter))
        result.push(EVENTS[i]);
    }
  }
  return result;
}

// ==================== 日历渲染 ====================
var CAT_COLORS={会议:"meeting",教学:"teaching",个人:"personal",截止日:"deadline"};
var REPEAT_LABEL={daily:"每天",weekly:"每周",biweekly:"每2周",triweekly:"每3周",quadweekly:"每4周",monthly:"每月",yearly:"每年"};
var currentYear,currentMonth,selectedDate=null,currentFilter="all";
var currentDetailIdx=-1,currentDetailDate="";
var deleteTargetIdx=-1;

function render(){
  document.getElementById("monthLabel").textContent=currentYear+"年"+(currentMonth+1)+"月";
  var grid=document.getElementById("daysGrid");grid.innerHTML="";
  var firstDay=new Date(currentYear,currentMonth,1).getDay();
  var daysInMonth=new Date(currentYear,currentMonth+1,0).getDate();
  var daysInPrev=new Date(currentYear,currentMonth,0).getDate();
  var today=new Date();
  var todayStr=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  
  for(var i=firstDay-1;i>=0;i--){
    var d=daysInPrev-i,pm=currentMonth===0?11:currentMonth-1,py=currentMonth===0?currentYear-1:currentYear;
    grid.appendChild(createCell(d,pm+1,py,"other-month",null));
  }
  for(var d=1;d<=daysInMonth;d++){
    var ds=dateStr(currentYear,currentMonth,d);
    var cls="",weekday=(firstDay+d-1)%7;
    if(weekday===0||weekday===6)cls+=" weekend-bg";
    if(ds===todayStr)cls+=" today";
    if(selectedDate===ds)cls+=" selected";
    if(isHoliday(currentYear,currentMonth+1,d))cls+=" holiday";
    grid.appendChild(createCell(d,currentMonth+1,currentYear,cls.trim(),ds));
  }
  var total=firstDay+daysInMonth,remaining=total%7===0?0:7-(total%7);
  for(var d=1;d<=remaining;d++){
    var nm=currentMonth===11?0:currentMonth+1,ny=currentMonth===11?currentYear+1:currentYear;
    grid.appendChild(createCell(d,nm+1,ny,"other-month",null));
  }
  var mevts=getMonthEvents(currentYear,currentMonth);
  document.getElementById("statsBar").innerHTML="<span>📅 本月 "+mevts.length+" 个事件</span><span>🏮 "+getGanZhiYear(currentYear)+"年 · "+getShengXiao(currentYear)+"</span>";
  updateSidebar();
}

function createCell(day,month,year,cls,dateStrVal){
  var cell=document.createElement("div");
  cell.className="day-cell "+(cls||"");
  var inner="<div class='day-num'>"+day+"</div>";
  // 农历
  if(year>=1900&&year<=2100){
    try{
      var lunar=solarToLunar(year,month,day);
      var lt=lunar.lunarDay===1?LUNAR_MONTH[lunar.lunarMonth-1]+"月":lunarDayStr(lunar.lunarDay);
      var hd=isHoliday(year,month,day);
      inner+="<div class='day-lunar"+(hd?" holiday-text":"")+"'>"+(hd||lt)+"</div>";
    }catch(e){}
  }
  // 事件
  var evts=dateStrVal?getEventsForDate(year,month-1,day):[];
  if(evts.length>0){
    inner+="<div class='day-dots'>";
    var seen={};
    for(var i=0;i<evts.length&&i<4;i++){
      if(!seen[evts[i].category]){seen[evts[i].category]=true;inner+="<span class='dot "+(CAT_COLORS[evts[i].category]||"meeting")+"'></span>";}
    }
    inner+="</div>";
    inner+="<div class='day-label'>"+(evts.length===1?evts[0].summary:evts.length+"个事件")+"</div>";
  }
  cell.innerHTML=inner;
  cell.onclick=function(){selectDate(year,month-1,day)};
  return cell;
}

function selectDate(y,m,d){
  var ds=dateStr(y,m,d);
  if(y===currentYear&&m===currentMonth){selectedDate=ds;render();}
  else{currentYear=y;currentMonth=m;selectedDate=ds;render();}
  updateSidebar(ds);
}

function updateSidebar(ds){
  var list=document.getElementById("eventList"),target=ds||selectedDate;
  if(!target){
    list.innerHTML="<div style='color:#666;padding:20px;text-align:center'>点击日历日期<br>查看/添加事件</div>";
    document.getElementById("sidebarDateLabel").textContent="事件详情";
    return;
  }
  var parts=target.split("-"),y=parseInt(parts[0]),m=parseInt(parts[1]),d=parseInt(parts[2]);
  var evts=getEventsForDate(y,m-1,d);
  var lunar=solarToLunar(y,m,d),hd=isHoliday(y,m,d);
  var linfo=lunar.lunarDay===1?LUNAR_MONTH[lunar.lunarMonth-1]+"月":lunarDayStr(lunar.lunarDay);
  document.getElementById("sidebarDateLabel").textContent=target+" 农历"+linfo+(hd?" 🏮"+hd:"");
  
  list.innerHTML="";
  if(evts.length===0){
    list.innerHTML="<div style='color:#666;font-size:13px;padding:8px 0'>无事件</div>";
  }else{
    for(var i=0;i<evts.length;i++){(function(idx){
      var e=evts[idx],st=new Date(e.start),et=new Date(e.end);
      var ts=String(st.getHours()).padStart(2,"0")+":"+String(st.getMinutes()).padStart(2,"0")+" - "+String(et.getHours()).padStart(2,"0")+":"+String(et.getMinutes()).padStart(2,"0");
      var item=document.createElement("div");item.className="event-item2";
      item.style.borderLeftColor="var(--"+(CAT_COLORS[e.category]||"meeting")+")";
      item.onclick=function(ev){ev.stopPropagation();openDetail(idx,target);};
      var infoWrap=document.createElement("div");infoWrap.style.cssText="flex:1;min-width:0";
      var td=document.createElement("div");td.className="e-time";td.textContent=ts;
      var tt=document.createElement("div");tt.className="e-title";tt.textContent=e.summary;
      if(e.repeat){var rp=document.createElement("span");rp.className="e-repeat";rp.textContent="🔁 "+REPEAT_LABEL[e.repeat];tt.appendChild(rp)}
      infoWrap.appendChild(td);infoWrap.appendChild(tt);
      var editBtn=document.createElement("button");editBtn.className="e-del";editBtn.style.background="var(--accent)";editBtn.textContent="✏";
      editBtn.onclick=function(ev){ev.stopPropagation();openForm(target,e,idx);};
      var delBtn=document.createElement("button");delBtn.className="e-del";delBtn.style.background="var(--danger)";delBtn.textContent="✕";
      delBtn.onclick=function(ev){ev.stopPropagation();confirmDelEvent(idx,target);};
      item.appendChild(infoWrap);item.appendChild(editBtn);item.appendChild(delBtn);list.appendChild(item);
    })(i)}
  }
  // 添加按钮
  var addBtn=document.createElement("div");
  addBtn.style.cssText="margin-top:8px;padding:8px;text-align:center;border:1px dashed var(--border);border-radius:6px;color:var(--accent);cursor:pointer;font-size:13px";
  addBtn.textContent="+ 添加事件";
  addBtn.onclick=function(){openForm(target,null,-1)};
  list.appendChild(addBtn);
  list._evts=evts;
}

// ==================== 弹窗操作 ====================
function closePopup(id,event){
  if(event&&event.target!==document.getElementById(id))return;
  document.getElementById(id).classList.remove("show");
}

function openDetail(idx,dateStr){
  var evts=document.getElementById("eventList")._evts;
  var e=evts[idx];if(!e)return;
  currentDetailIdx=idx;currentDetailDate=dateStr;
  document.getElementById("dcTitle").textContent=e.summary;
  var st=new Date(e.start),et=new Date(e.end);
  document.getElementById("dcTime").innerHTML="🕐 "+st.toLocaleString("zh-CN")+" → "+et.toLocaleTimeString("zh-CN");
  document.getElementById("dcLoc").innerHTML=e.location?"📍 "+e.location:"";
  document.getElementById("dcRepeat").innerHTML=e.repeat?"🔁 "+REPEAT_LABEL[e.repeat]:"";
  document.getElementById("dcDesc").textContent=e.description||"无描述";
  document.getElementById("detailPopup").classList.add("show");
  // 编辑按钮
  document.getElementById("btnEdit").onclick=function(){
    closePopup("detailPopup");openForm(dateStr,e,idx);
  };
  document.getElementById("btnDel").onclick=function(){
    closePopup("detailPopup");confirmDelEvent(idx,dateStr);
  };
}

function confirmDelEvent(idx,dateStr){
  var evts=document.getElementById("eventList")._evts;
  if(!evts||!evts[idx])return;
  deleteTargetIdx=-1;
  // 在全局EVENTS中找到实际索引
  var target=evts[idx];
  for(var i=0;i<EVENTS.length;i++){
    if(EVENTS[i].summary===target.summary&&EVENTS[i].start===target.start&&EVENTS[i].end===target.end){
      deleteTargetIdx=i;break;
    }
  }
  if(deleteTargetIdx<0)return;
  document.getElementById("delConfirmMsg").textContent="「"+target.summary+"」将被删除。重复事件仅删除该事件本身。";
  document.getElementById("deleteConfirm").classList.add("show");
}

function confirmDelete(){
  if(deleteTargetIdx>=0){
    EVENTS.splice(deleteTargetIdx,1);
    saveEvents();selectedDate=null;render();
  }
  closePopup("deleteConfirm");deleteTargetIdx=-1;
}

// ==================== 事件表单 ====================
function openForm(dateStr,existingEvent,existingIdx){
  var parts=dateStr.split("-"),y=parts[0],m=parts[1],d=parts[2];

  var realIdx=-1;

    for(var k=0;k<EVENTS.length;k++){
      if(EVENTS[k].summary===existingEvent.summary&&EVENTS[k].start===existingEvent.start&&EVENTS[k].end===existingEvent.end){
        realIdx=k;break;
      }
    }
  }
  document.getElementById("fEditIndex").value=realIdx;

    document.getElementById("fStart").value=dateBase+"T09:00";
    document.getElementById("fEnd").value=dateBase+"T10:00";
    document.getElementById("fLocation").value="";
    document.getElementById("fCategory").value="会议";
    document.getElementById("fRepeat").value="";
    document.getElementById("fRepeatUntil").value="";
    document.getElementById("fDescription").value="";
  }
  document.getElementById("formPopup").classList.add("show");
  setTimeout(function(){document.getElementById("fSummary").focus()},200);
}

function saveEvent(){
  var s=document.getElementById("fSummary").value.trim();
  if(!s){alert("请输入事件标题");return;}
  var evt={
    summary:s,
    start:document.getElementById("fStart").value,
    end:document.getElementById("fEnd").value,
    location:document.getElementById("fLocation").value.trim(),
    category:document.getElementById("fCategory").value,
    description:document.getElementById("fDescription").value.trim(),
    repeat:document.getElementById("fRepeat").value,
    repeatUntil:document.getElementById("fRepeatUntil").value
  };
  var editIdx=parseInt(document.getElementById("fEditIndex").value);
  if(editIdx>=0){
    EVENTS[editIdx]=evt;
  }else{
    EVENTS.push(evt);
  }
  saveEvents();
  closePopup("formPopup");
  var dp=document.getElementById("fDateBase").value;
  if(dp){var p=dp.split("-");selectDate(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));}
  else{selectedDate=null;render();}
}

function smartParse(){
  var text=document.getElementById("smartInput").value.trim();
  var preview=document.getElementById("smartPreview");
  if(!text){preview.style.display="block";preview.innerHTML="<span style='color:#e74c3c'>请输入文字或上传文件</span>";return;}
  
  var r=extractEvent(text);
  var today=new Date();today.setHours(0,0,0,0);
  var targetDate=r.date||today;
  var ds=targetDate.getFullYear()+"-"+String(targetDate.getMonth()+1).padStart(2,"0")+"-"+String(targetDate.getDate()).padStart(2,"0");
  var df=targetDate.getMonth()+1+"月"+targetDate.getDate()+"日";

  if(r.repeat)html+='<div>🔁 '+r.repeatLabel+'</div>';if(r.repeatUntil)html+='<div>⏱ 截止 '+r.repeatUntil+'</div>';
  html+='<button onclick="confirmSmartAdd()" style="margin-top:6px;width:100%;padding:6px;border-radius:6px;border:none;background:var(--save);color:#fff;cursor:pointer;font-size:12px;font-weight:600">✅ 确认添加</button>';
  html+='</div>';
  preview.innerHTML=html;
  preview._parsed=r;
}

function extractEvent(text){
  var r={title:"未命名事件",date:null,startTime:"09:00",endTime:"10:00",location:"",category:"个人",repeat:"",repeatLabel:"",description:text};
  var today=new Date();today.setHours(0,0,0,0);
  
  // === 日期提取 ===
  var datePatterns=[
    {re:/(\d{4})[年\-](\d{1,2})[月\-](\d{1,2})[日]?/, fn:function(m){return new Date(parseInt(m[1]),parseInt(m[2])-1,parseInt(m[3]))}},
    {re:/(\d{1,2})月(\d{1,2})[日号]?/, fn:function(m){return new Date(today.getFullYear(),parseInt(m[1])-1,parseInt(m[2]))}},
    {re:/明天/, fn:function(){var d=new Date(today);d.setDate(d.getDate()+1);return d}},
    {re:/后天/, fn:function(){var d=new Date(today);d.setDate(d.getDate()+2);return d}},
    {re:/今天/, fn:function(){return new Date(today)}},
    {re:/大后天/, fn:function(){var d=new Date(today);d.setDate(d.getDate()+3);return d}},
    {re:/下周([一二三四五六日天])/, fn:function(m){return nextWeekday(today,weekdayNum(m[1]))}},
    {re:/周([一二三四五六日天])/, fn:function(m){return thisWeekday(today,weekdayNum(m[1]))}},
    {re:/下下?周([一二三四五六日天])/, fn:function(m){return nextWeekday(today,weekdayNum(m[1]),2)}},
  ];
  for(var i=0;i<datePatterns.length;i++){
    var m=text.match(datePatterns[i].re);
    if(m){r.date=datePatterns[i].fn(m);break;}
  }
  
  // === 时间提取 ===
  var timePatterns=[
    {re:/下午(\d{1,2})点(\d{1,2})分?/, fn:function(m){var h=parseInt(m[1]);return (h==12?12:h+12)+":"+String(m[2]||"00").padStart(2,"0")}},
    {re:/上午(\d{1,2})点(\d{1,2})分?/, fn:function(m){var h=parseInt(m[1]);return (h==12?0:h)+":"+String(m[2]||"00").padStart(2,"0")}},
    {re:/下午(\d{1,2})点/, fn:function(m){var h=parseInt(m[1]);return (h==12?12:h+12)+":00"}},
    {re:/上午(\d{1,2})点/, fn:function(m){var h=parseInt(m[1]);return (h==12?0:h)+":00"}},
    {re:/晚上(\d{1,2})点/, fn:function(m){var h=parseInt(m[1]);return (h==12?12:h+12)+":00"}},
    {re:/(\d{1,2}):(\d{2})/, fn:function(m){return String(parseInt(m[1])).padStart(2,"0")+":"+m[2]}},
    {re:/(\d{1,2})点半/, fn:function(m){var h=parseInt(m[1]);return (h<8?h+12:h)+":30"}},
    {re:/(\d{1,2})点(\d{1,2})分?/, fn:function(m){var h=parseInt(m[1]);return (h<8?h+12:h)+":"+String(m[2]||"00").padStart(2,"0")}},
    {re:/(\d{1,2})点/, fn:function(m){var h=parseInt(m[1]);return (h<8?h+12:h)+":00"}},
  ];
  for(var i=0;i<timePatterns.length;i++){
    var m=text.match(timePatterns[i].re);
    if(m){r.startTime=timePatterns[i].fn(m);break;}
  }
  // 时间范围："X点到Y点" "X:00-Y:00"
  var rangeM=text.match(/到\s*((?:下午|上午|晚上)?\d{1,2}[点:：]\d{0,2})/);
  if(rangeM){
    var endText=rangeM[1];
    for(var i=0;i<timePatterns.length;i++){
      var em=endText.match(timePatterns[i].re);
      if(em){r.endTime=timePatterns[i].fn(em);break;}
    }
  }else{
    // 默认持续时间1小时
    var parts=r.startTime.split(":"),h=parseInt(parts[0]),m=parseInt(parts[1]);
    h+=1;if(h>=24)h-=24;
    r.endTime=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  }
  
  // === 地点提取 ===
  var locPatterns=[
    /在([^\s，,。.]{2,20}?(?:会议室|办公室|教室|报告厅|大厅|中心|大楼|室|厅|馆|楼|层|房间|\d+号?楼|\d+室|[\u4e00-\u9fa5]+楼\d*))/,
    /([\u4e00-\u9fa5]{2,4}楼\d{0,4})/,
    /(\d{2,4}[号]?[教教室室])/,
    /(行政楼|教学楼|实验楼|实训楼|综合楼|办公楼|图书馆|食堂|宿舍楼)[\d]*/,
    /([\u4e00-\u9fa5\d]{1,4}号(?:会议室|办公室|教室|报告厅|大厅|中心|大楼|楼|室|厅|馆))/,
    /地点[：:]*\s*([^\s，,。.]+)/,
    /位置[：:]*\s*([^\s，,。.]+)/,
  ];
  for(var i=0;i<locPatterns.length;i++){
    var m=text.match(locPatterns[i]);
    if(m){r.location=m[1];break;}
  }
  
  // === 分类 ===
  if(/教学|上课|课程|培训|讲座|实训|实验/.test(text))r.category="教学";
  else if(/会议|党委|班子|研讨|评审|答辩|汇报/.test(text))r.category="会议";
  else if(/截止|DDL|deadline|最后|提交|上报/.test(text))r.category="截止日";
  
  // === 重复 ===
  var untilMatch=text.match(/(?:截至|截止|到)\s*(?:事件|日期)?[：:]*\s*(\d{1,2})月(\d{1,2})[日号]?/);if(untilMatch){var uM=parseInt(untilMatch[1]),uD=parseInt(untilMatch[2]);if(r.date)r.repeatUntil=r.date.getFullYear()+"-"+String(uM).padStart(2,"0")+"-"+String(uD).padStart(2,"0");}if(/每周([一二三四五六日天])/.test(text)){r.repeat="weekly";r.repeatLabel="每周"}
  else if(/每(\d{1,2})周/.test(text)){var n=parseInt(text.match(/每(\d{1,2})周/)[1]);if(n==2)r.repeat="biweekly";else if(n==3)r.repeat="triweekly";else if(n==4)r.repeat="quadweekly";else r.repeat="weekly";r.repeatLabel="每"+n+"周"}
  else if(/每周/.test(text)||/周会/.test(text)){r.repeat="weekly";r.repeatLabel="每周"}
  else if(/每天/.test(text)){r.repeat="daily";r.repeatLabel="每天"}
  else if(/每月/.test(text)){r.repeat="monthly";r.repeatLabel="每月"}
  else if(/每年/.test(text)){r.repeat="yearly";r.repeatLabel="每年"}
  
  // === 标题 ===
  var titlePatterns=[
    /(?:关于|召开|举行|参加|开|组织|进行).{0,2}(.{2,20}?(?:研讨会|评审会|答辩|讲座|培训|课程|座谈|汇报|考试|比赛|活动|会议|党委会|办公会|班后会))/,
    // secondary title removed
  ];
  for(var i=0;i<titlePatterns.length;i++){
    var m=text.match(titlePatterns[i]);
    if(m){r.title=m[1];break;}
  }
  if(r.title==="未命名事件"){
    // 按优先级匹配标题关键词
    var titleKwds=[
      /([\u4e00-\u9fa5]{2,8}例会)/,
      /([\u4e00-\u9fa5]{2,8}教学研讨会)/,
      /([\u4e00-\u9fa5]{2,8}党委会)/,
      /([\u4e00-\u9fa5]{2,8}办公会)/,
      /([\u4e00-\u9fa5]{2,8}座谈会)/,
      /([\u4e00-\u9fa5]{2,8}研讨会)/,
      /([\u4e00-\u9fa5]{2,8}讲座)/,
      /([\u4e00-\u9fa5]{2,8}培训)/,
      /([\u4e00-\u9fa5]{2,8}课程)/,
      /([\u4e00-\u9fa5]{2,8}会议)/,
    ];
    for(var i=0;i<titleKwds.length;i++){
      var m=text.match(titleKwds[i]);
      if(m){r.title=m[1];break;}
    }
    if(r.title==="未命名事件"){
      var first=text.split(/[。！？\n]/)[0].trim();
      if(first.length>3&&first.length<30)r.title=first;
      else r.title=first.substring(0,20)+"...";
    }
  }
  
  return r;
}

var _libsLoaded={};

function loadLib(url,name,cb){
  if(_libsLoaded[name]){cb();return}
  if(_libsLoaded[name+"_loading"])return;
  _libsLoaded[name+"_loading"]=true;
  var s=document.createElement("script");
  s.src=url;s.onload=function(){_libsLoaded[name]=true;cb()};
  s.onerror=function(){alert(name+"加载失败，请检查网络");_libsLoaded[name+"_loading"]=false};
  document.head.appendChild(s);
}

function handleFileUpload(event){
  var file=event.target.files[0];
  if(!file)return;
  if(file.size>10*1024*1024){alert("文件不能超过10MB");return}
  var name=file.name,ext=name.split(".").pop().toLowerCase();
  var allowed=[".txt",".md",".docx",".pdf"];
  if(allowed.indexOf("."+ext)<0){alert("支持格式：txt, md, docx, pdf");return}
  
  var textarea=document.getElementById("smartInput");
  var preview=document.getElementById("smartPreview");
  
  if(ext==="txt"||ext==="md"){
    var reader=new FileReader();
    reader.onload=function(e){appendText(e.target.result)};
    reader.readAsText(file,"utf-8");
  }else if(ext==="docx"){
    preview.style.display="block";
    preview.innerHTML="<span style='color:var(--accent)'>⏳ 正在解析Word文档...</span>";
    loadLib("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js","mammoth",function(){
      var reader=new FileReader();
      reader.onload=function(e){
        mammoth.extractRawText({arrayBuffer:e.target.result}).then(function(r){appendText(r.value)}).catch(function(err){alert("Word解析失败: "+err.message);preview.style.display="none"});
      };
      reader.readAsArrayBuffer(file);
    });
  }else if(ext==="pdf"){
    preview.style.display="block";
    preview.innerHTML="<span style='color:var(--accent)'>⏳ 正在解析PDF...</span>";
    loadLib("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js","pdfjs",function(){
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      var reader=new FileReader();
      reader.onload=function(e){
        pdfjsLib.getDocument({data:e.target.result}).promise.then(function(pdf){
          var texts=[],pages=Math.min(pdf.numPages,20),promises=[];
          for(var i=1;i<=pages;i++){
            promises.push(pdf.getPage(i).then(function(page){
              return page.getTextContent().then(function(tc){
                return tc.items.map(function(it){return it.str}).join(" ");
              });
            }));
          }
          Promise.all(promises).then(function(pageTexts){
            var allText=pageTexts.join("\n").trim();
            if(allText.length<50){
              // 扫描版PDF，切OCR
              preview.innerHTML="<span style='color:var(--accent)'>⏳ 扫描版PDF，正在OCR识别...</span>";
              loadLib("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js","tesseract",function(){
                var ocrPromises=[],ocrTexts=[];
                for(var i=1;i<=pages;i++){
                  (function(pn){
                    ocrPromises.push(pdf.getPage(pn).then(function(page){
                      var canvas=document.createElement("canvas");
                      var vp=page.getViewport({scale:2.0});
                      canvas.width=vp.width;canvas.height=vp.height;
                      return page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise.then(function(){
                        return Tesseract.recognize(canvas,"chi_sim").then(function(r){ocrTexts[pn-1]=r.data.text});
                      });
                    }));
                  })(i);
                }
                Promise.all(ocrPromises).then(function(){appendText(ocrTexts.join("\n"))}).catch(function(err){alert("OCR失败: "+err.message);preview.style.display="none"});
              });
            }else{
              appendText(allText);
            }
          }).catch(function(err){alert("PDF解析失败: "+err.message);preview.style.display="none"});
        }).catch(function(err){alert("PDF加载失败: "+err.message);preview.style.display="none"});
      };
      reader.readAsArrayBuffer(file);
    });
  } else if(["jpg","jpeg","png","bmp","webp"].indexOf(ext)>=0){
    preview.style.display="block";
    preview.innerHTML="<span style='color:var(--accent)'>⏳ 正在OCR识别图片（首次下载中文包约10MB）...</span>";
    loadLib("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js","tesseract",function(){
      Tesseract.recognize(file,"chi_sim",{logger:function(m){if(m.status==="recognizing text")preview.innerHTML="<span style='color:var(--accent)'>⏳ 识别中..."+Math.round(m.progress*100)+"%</span>"}}).then(function(r){appendText(r.data.text)}).catch(function(err){alert("OCR失败: "+err.message);preview.style.display="none"});
    });
  }
  
  function appendText(content){
    var existing=textarea.value.trim();
    textarea.value=(existing?existing+"\n":"")+content;
    preview.style.display="none";
  }
}

function confirmSmartAdd(){
  var preview=document.getElementById("smartPreview");
  var r=preview._parsed;
  if(!r)return;
  
  var today=new Date();today.setHours(0,0,0,0);
  var targetDate=r.date||today;
  var ds=targetDate.getFullYear()+"-"+String(targetDate.getMonth()+1).padStart(2,"0")+"-"+String(targetDate.getDate()).padStart(2,"0");
  var startDt=ds+"T"+r.startTime;
  var endDt=ds+"T"+r.endTime;
  
  var evt={
    summary:r.title,
    start:startDt,
    end:endDt,
    location:r.location,
    category:r.category,
    description:r.description,
    repeat:r.repeat,
    repeatUntil:r.repeatUntil||""
  };
  EVENTS.push(evt);
  saveEvents();
  
  // 选中该日期
  var p=ds.split("-");
  selectDate(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  
  // 清空
  document.getElementById("smartInput").value="";
  document.getElementById("smartPreview").style.display="none";
  document.getElementById("smartFile").value="";
}

function weekdayNum(c){var m={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"日":0,"天":0};return m[c]!==undefined?m[c]:1}
function nextWeekday(today,targetDay,weeksAhead){
  weeksAhead=weeksAhead||1;
  var todayDay=today.getDay();
  var daysUntil=targetDay-todayDay;
  if(daysUntil<=0)daysUntil+=7;
  daysUntil+=(weeksAhead-1)*7;
  var d=new Date(today);d.setDate(d.getDate()+daysUntil);return d;
}
function thisWeekday(today,targetDay){
  var todayDay=today.getDay();
  var daysUntil=targetDay-todayDay;
  if(daysUntil<0)daysUntil+=7;
  var d=new Date(today);d.setDate(d.getDate()+daysUntil);return d;
}
function prevMonth(){currentMonth--;if(currentMonth<0){currentMonth=11;currentYear--;}selectedDate=null;render()}
function nextMonth(){currentMonth++;if(currentMonth>11){currentMonth=0;currentYear++;}selectedDate=null;render()}
function goToday(){var t=new Date();currentYear=t.getFullYear();currentMonth=t.getMonth();selectedDate=dateStr(currentYear,currentMonth,t.getDate());render()}
